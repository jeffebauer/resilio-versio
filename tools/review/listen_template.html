<style>
:root {
  --bg: #f4f2ee; --panel: #ffffff; --ink: #1b1a18; --muted: #66625b; --line: #dfd9ce; --chip: #ece8e0;
  --clean: #2f8f5b; --driven: #c98a14; --kicked: #c0392b;
  --g1: #2a6fb4; --g2: #b4532a; --g3: #7a4bb0; --g4: #1f8a8a; --g5: #8a6d1f; --g6: #b03a6f;
  --v0: #6b6760; --v1: #b4532a; --v2: #2a6fb4; --v3: #7a4bb0; --v4: #1f8a8a; --v5: #8a6d1f; --v6: #b03a6f; --v7: #3f7f2a;
  --ref: #1b1a18; --warn: #b3261e;
  --on-accent: #ffffff; --focus: #2a6fb4;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151413; --panel: #1f1e1c; --ink: #ece8e0; --muted: #a29d93; --line: #35322d; --chip: #2a2825;
    --clean: #4cbf82; --driven: #e8ad3a; --kicked: #e8604f;
    --g1: #5d9ee6; --g2: #e0774a; --g3: #a883dd; --g4: #43bcbc; --g5: #d4b04a; --g6: #e070a4;
    --v0: #a29d93; --v1: #e0774a; --v2: #5d9ee6; --v3: #a883dd; --v4: #43bcbc; --v5: #d4b04a; --v6: #e070a4; --v7: #7cc45e;
    --ref: #ece8e0; --warn: #f28b82;
    --on-accent: #141312; --focus: #6fa6e0;
  }
}
:root[data-theme="dark"] {
  --bg: #151413; --panel: #1f1e1c; --ink: #ece8e0; --muted: #a29d93; --line: #35322d; --chip: #2a2825;
  --clean: #4cbf82; --driven: #e8ad3a; --kicked: #e8604f;
  --g1: #5d9ee6; --g2: #e0774a; --g3: #a883dd; --g4: #43bcbc; --g5: #d4b04a; --g6: #e070a4;
  --v0: #a29d93; --v1: #e0774a; --v2: #5d9ee6; --v3: #a883dd; --v4: #43bcbc; --v5: #d4b04a; --v6: #e070a4; --v7: #7cc45e;
  --ref: #ece8e0; --warn: #f28b82;
  --on-accent: #141312; --focus: #6fa6e0;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
main { max-width: 1400px; margin: 0 auto; padding: 24px 16px 56px; }
h1 { font-size: 26px; margin: 0 0 6px; letter-spacing: -0.01em; }
.lede { color: var(--muted); margin: 0 0 10px; max-width: 80ch; }
.layout { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
details.readme { margin: 0 0 12px; font-size: 13px; color: var(--muted); }
details.readme pre { white-space: pre-wrap; background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  padding: 10px 12px; font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--ink); }

.fixed { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 16px; }
.fixed .lab { color: var(--muted); font-size: 13px; margin-right: 4px; }
.chip { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; font-size: 14px; white-space: nowrap; }
.chip b { font-weight: 700; letter-spacing: 0.02em; }
.chip i { font-style: normal; color: var(--muted); font-size: 12.5px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips .chip { font-size: 12.5px; padding: 2px 8px; background: var(--chip); }

.toolbar { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: center;
  background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(6px);
  padding: 10px 0; margin: 0 0 8px; border-bottom: 1px solid var(--line); }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--panel); }
.seg button { border: 0; background: transparent; color: var(--ink); font: inherit; font-weight: 700; padding: 7px 12px; cursor: pointer;
  border-right: 1px solid var(--line); min-width: 36px; }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--vc); color: var(--on-accent); }
.tlabel { font-size: 13px; color: var(--muted); }
.toggle { display: inline-flex; align-items: center; gap: 7px; padding: 6px 11px; border: 1px solid var(--line);
  border-radius: 999px; background: var(--panel); cursor: pointer; user-select: none; font-size: 14px; }
.toggle input { accent-color: var(--g1); }
select.ctl { padding: 6px 8px; }

.legend { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; margin: 12px 0 22px; }
.legend div { background: var(--panel); border: 1px solid var(--line); border-left: 5px solid var(--vc); border-radius: 8px;
  padding: 8px 10px; font-size: 13px; color: var(--muted); }
.legend b { color: var(--ink); display: block; font-size: 14px; }

.row { margin: 0 0 22px; }
.rowhead { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; margin: 0 0 8px; }
.rowhead h2 { margin: 0; font-size: 20px; }
.rowhead .note { color: var(--muted); font-size: 14px; }
.cols { display: grid; grid-template-columns: repeat(var(--ncols, 3), minmax(0, 1fr)); gap: 12px; }
.cols.single { max-width: 720px; }

.cell { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
.cell.empty { border-style: dashed; background: transparent; color: var(--muted); display: grid; place-items: center; min-height: 80px; font-size: 13px; }
.cell.active { box-shadow: 0 0 0 2px var(--ac); border-color: var(--ac); }
.band { background: var(--ac); color: var(--on-accent); padding: 8px 12px; display: flex; flex-wrap: wrap; gap: 2px 10px; justify-content: space-between; align-items: baseline; }
.band .att { font-weight: 800; letter-spacing: 0.08em; font-size: 15px; }
.band .what { font-size: 12.5px; opacity: 0.9; }
.body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 8px; }

.voices { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 6px; }
.voices.few { grid-template-columns: 1fr; }
.voice { display: flex; align-items: center; gap: 10px; width: 100%; border: 1px solid var(--line); background: var(--chip);
  color: var(--ink); border-radius: 9px; padding: 6px 9px; font: inherit; text-align: left; cursor: pointer; min-width: 0; }
.voice .k { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 7px; background: var(--vc);
  color: var(--on-accent); font-weight: 800; flex: none; }
.voice .t { display: flex; flex-direction: column; min-width: 0; }
.voice .n { font-size: 14px; overflow-wrap: anywhere; }
.voice .d { font-size: 12px; color: var(--muted); }
.voice .flag { color: var(--warn); font-weight: 700; }
.voice[aria-pressed="true"] { background: var(--panel); border-color: var(--vc); box-shadow: inset 0 0 0 2px var(--vc); }
.voice[aria-pressed="true"] .n { font-weight: 650; }
.voice:focus-visible, .ctl:focus-visible, .seg button:focus-visible, .pick button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.spec { width: 100%; height: 64px; display: block; border-radius: 6px; background: #080a14; cursor: pointer; }
.transport { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.ctl { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 8px; padding: 5px 10px;
  font: inherit; font-size: 13px; cursor: pointer; }
.ctl.play { background: var(--ink); color: var(--panel); border-color: var(--ink); min-width: 70px; font-weight: 650; }
.time { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; margin-left: auto; }
.scrub { width: 100%; accent-color: var(--ac); margin: 0; }
.reveal { font-size: 12.5px; color: var(--muted); }
.reveal:empty { display: none; }

.pick { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding-top: 8px; border-top: 1px dashed var(--line); }
.pick .pl { font-size: 13px; font-weight: 650; margin-right: 2px; }
.pick button { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 7px; min-width: 32px;
  padding: 4px 8px; font: inherit; font-weight: 700; cursor: pointer; }
.pick button[aria-pressed="true"] { background: var(--vc); border-color: var(--vc); color: var(--on-accent); }
.notesrow .cols textarea, .general textarea { width: 100%; min-height: 110px; resize: vertical; border: 1px solid var(--line);
  border-top: 5px solid var(--ac); border-radius: 10px; background: var(--panel); color: var(--ink); padding: 10px 12px;
  font: inherit; font-size: 14px; }
.general textarea { border-top-color: var(--line); min-height: 80px; }
.notelab { font-weight: 700; font-size: 13px; letter-spacing: 0.06em; margin: 0 0 6px; color: var(--ac); }
.ctl.primary { background: var(--g1); color: var(--on-accent); border-color: var(--g1); font-weight: 650; }
.saved { font-size: 13px; color: var(--muted); }
.keys { color: var(--muted); font-size: 13px; margin-top: 18px; }
kbd { background: var(--chip); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; font-size: 12px; }

@media (max-width: 980px) {
  .cols { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <p class="lede" id="lede"></p>
  <p class="layout" id="layout"></p>
  <details class="readme" id="readme" hidden><summary>README from the render folder</summary><pre></pre></details>
  <div class="fixed" id="fixed"></div>

  <div class="toolbar">
    <span class="tlabel">Switch every panel to</span>
    <div class="seg" id="global"></div>
    <label class="toggle" id="lmwrap"><input type="checkbox" id="levelmatch"> Level-match</label>
    <label class="toggle"><input type="checkbox" id="blind"> Blind (hide and shuffle)</label>
    <label class="toggle"><input type="checkbox" id="loop"> Loop</label>
    <label class="toggle" id="refwrap" hidden>Compare with <select class="ctl" id="ref"><option value="">no reference</option></select></label>
    <button class="ctl primary" type="button" id="copy">Copy results for Claude</button>
    <button class="ctl" type="button" id="download">Download results</button>
    <span class="saved" id="saved"></span>
  </div>

  <div class="legend" id="legend"></div>
  <div id="rows"></div>
  <section class="row notesrow"><div class="rowhead"><h2>Notes</h2><span class="note" id="notesnote">saved as you type</span></div><div class="cols" id="notes"></div></section>
  <section class="row general"><div class="rowhead"><h2>Overall</h2><span class="note">anything else: what works, what bothers you, what to try next</span></div><textarea id="overall" placeholder="General notes"></textarea></section>

  <p class="keys" id="keys"></p>
</main>

<script id="rv-data" type="application/json">__RV_DATA_JSON__</script>
<script>
(function () {
"use strict";
const DATA = JSON.parse(document.getElementById("rv-data").textContent);
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const chipHtml = c => `<span class="chip"><b>${esc(c.k)}</b> ${esc(c.v)}${c.c ? ` <i>${esc(c.c)}</i>` : ""}</span>`;
const VC = i => `var(--v${i % 8})`;
const fmt = t => isFinite(t) ? Math.floor(t / 60) + ":" + String(Math.floor(t % 60)).padStart(2, "0") : "0:00";
const shuffled = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };

/* ---------- state (localStorage is a convenience: Copy/Download are the record) ---------- */
let state = { picks: {}, notes: {}, overall: "", blind: {}, levelMatch: DATA.levelMatch, ref: "" };
try { const raw = localStorage.getItem(DATA.storeKey); if (raw) state = Object.assign(state, JSON.parse(raw)); } catch (e) {}
const savedEl = $("saved");
function save() {
  try { localStorage.setItem(DATA.storeKey, JSON.stringify(state)); savedEl.textContent = "Saved"; }
  catch (e) { savedEl.textContent = "Not saved in this browser: use Copy or Download before closing"; }
}

/* ---------- header ---------- */
$("title").textContent = DATA.title;
document.title = DATA.title;
$("lede").textContent = DATA.lede ||
  "Each panel plays its versions in sync: pick one and it switches at the same moment, so you only hear the difference.";
const ax = [];
if (DATA.axes.columns) ax.push("columns are " + DATA.colsTitle);
if (DATA.axes.rows) ax.push("rows are " + DATA.axes.rows);
if (DATA.axes.variants) ax.push("A, B, C… inside a panel are " + DATA.variantsTitle);
$("layout").textContent = (ax.length ? ax.join(" · ") + ". " : "") + "Source: " + DATA.source;
if (DATA.readme) { $("readme").hidden = false; $("readme").querySelector("pre").textContent = DATA.readme; }
if (DATA.fixed.length) $("fixed").innerHTML = `<span class="lab">Same for every file</span>` + DATA.fixed.map(chipHtml).join("");

const lmEl = $("levelmatch"), blindEl = $("blind"), loopEl = $("loop"), refEl = $("ref");
const hasRms = Object.values(DATA.items).some(it => it.rms != null);
if (!hasRms) $("lmwrap").hidden = true;
lmEl.checked = !!state.levelMatch && hasRms;
lmEl.parentElement.title = "Plays every version in a panel at the loudness of the quietest one, so none wins by being louder";
if (DATA.references.length) {
  $("refwrap").hidden = false;
  DATA.references.forEach(r => { const o = document.createElement("option"); o.value = r.id; o.textContent = r.name; refEl.appendChild(o); });
  if (DATA.references.some(r => r.id === state.ref)) refEl.value = state.ref;
}
const refById = id => DATA.references.find(r => r.id === id) || null;

/* ---------- spectrogram colours (dark blue -> teal -> amber -> pale yellow) ---------- */
const STOPS = [[0, 8, 10, 20], [0.15, 20, 32, 84], [0.35, 21, 96, 130], [0.55, 46, 150, 116], [0.72, 190, 170, 70], [0.88, 235, 165, 70], [1, 255, 233, 168]];
const LUT = [];
for (let i = 0; i < 256; i++) {
  const t = i / 255; let c = STOPS[STOPS.length - 1].slice(1);
  for (let s = 0; s < STOPS.length - 1; s++) {
    const a = STOPS[s], b = STOPS[s + 1];
    if (t >= a[0] && t <= b[0]) { const f = (t - a[0]) / (b[0] - a[0] || 1); c = [1, 2, 3].map(j => Math.round(a[j] + (b[j] - a[j]) * f)); break; }
  }
  LUT.push(c);
}
const specCache = {};
function specImage(src) {
  if (!src || !src.spec) return null;
  const key = src.wav;
  if (specCache[key]) return specCache[key];
  const s = src.spec, bin = atob(s.b64), off = document.createElement("canvas");
  off.width = s.w; off.height = s.h;
  const ctx = off.getContext("2d"), img = ctx.createImageData(s.w, s.h);
  for (let i = 0; i < s.w * s.h; i++) { const c = LUT[bin.charCodeAt(i)]; img.data[i * 4] = c[0]; img.data[i * 4 + 1] = c[1]; img.data[i * 4 + 2] = c[2]; img.data[i * 4 + 3] = 255; }
  ctx.putImageData(img, 0, 0);
  return (specCache[key] = off);
}

/* ---------- panels ---------- */
const NCOLS = DATA.cols.length;
const groups = [];
let current = null;
const maxVariants = Math.max(1, ...Object.values(DATA.panels).map(p => p.variants.length));

function makeGroup(row, col, panel, key) {
  const g = { key, row, col, panel, sel: 0, playing: false, audios: [], sources: [], order: panel.variants.map((_, i) => i), refAudio: null, ref: null };
  const n = panel.variants.length;
  const cell = document.createElement("section");
  cell.className = "cell";
  cell.style.setProperty("--ac", `var(${col.color})`);
  const bandMain = col.name || row.name || DATA.title;
  const bandSub = [col.what, col.name ? row.name : ""].filter(Boolean).join(" · ");
  const hasSpec = panel.variants.some(v => DATA.items[v.item].spec);
  cell.innerHTML = `
    <div class="band"><span class="att">${esc(bandMain)}</span><span class="what">${esc(bandSub)}</span></div>
    <div class="body">
      ${panel.chips.length ? `<div class="chips">${panel.chips.map(chipHtml).join("")}</div>` : ""}
      <div class="voices${n <= 5 ? " few" : ""}"></div>
      ${hasSpec ? `<canvas class="spec" aria-label="Spectrogram of the selected version (click to jump)"></canvas>` : ""}
      <div class="transport">
        <button class="ctl play" type="button">Play</button>
        ${row.marks.map(m => `<button class="ctl jump" type="button" data-t="${m[1]}">${esc(m[0])}</button>`).join("")}
        <span class="time">0:00 / 0:00</span>
      </div>
      <input class="scrub" type="range" min="0" max="1000" value="0" aria-label="Position">
      <div class="reveal"></div>
      ${n > 1 ? `<div class="pick"><span class="pl">My pick</span></div>` : ""}
    </div>`;
  g.el = cell;
  panel.variants.forEach((v, i) => {
    const it = DATA.items[v.item];
    const a = new Audio();
    a.preload = "metadata";
    a.src = it.wav;
    a.muted = i !== 0;
    g.audios.push(a); g.sources.push(it);
  });
  const voicesEl = cell.querySelector(".voices"), timeEl = cell.querySelector(".time");
  const scrub = cell.querySelector(".scrub"), playBtn = cell.querySelector(".play"), revealEl = cell.querySelector(".reveal");
  const pickEl = cell.querySelector(".pick"), canvas = cell.querySelector(".spec");
  const master = () => g.audios[g.sel] || g.audios[0];
  g.pick = state.picks[key] != null && state.picks[key] < n ? state.picks[key] : null;

  g.gainDb = i => {
    if (!lmEl.checked) return 0;
    const all = g.sources.map(s => s.rms).filter(r => r != null);
    const r = g.sources[i] && g.sources[i].rms;
    if (r == null || !all.length) return 0;
    return Math.max(-30, Math.min(...all) - r);
  };
  g.applyGains = () => g.audios.forEach((a, i) => { a.volume = Math.pow(10, g.gainDb(i) / 20); });

  g.renderPick = () => {
    if (!pickEl) return;
    pickEl.querySelectorAll("button").forEach(b => b.remove());
    g.order.forEach((vi, pos) => {
      const v = panel.variants[vi];
      const b = document.createElement("button");
      b.type = "button";
      b.style.setProperty("--vc", blindEl.checked ? VC(0) : VC(vi));
      b.textContent = blindEl.checked ? String(pos + 1) : v.k;
      b.title = blindEl.checked ? "pick #" + (pos + 1) : "pick " + (v.n || v.k);
      b.setAttribute("aria-pressed", g.pick === vi ? "true" : "false");
      b.addEventListener("click", () => {
        g.pick = g.pick === vi ? null : vi;
        if (g.pick === null) { delete state.picks[key]; delete state.blind[key]; }
        else { state.picks[key] = g.pick; if (blindEl.checked) state.blind[key] = true; else delete state.blind[key]; }
        save(); g.renderPick();
      });
      pickEl.appendChild(b);
    });
  };

  g.render = () => {
    voicesEl.innerHTML = "";
    const entries = g.order.map((vi, pos) => ({ vi, pos }));
    if (g.ref) entries.push({ vi: n, pos: n });
    g.buttons = entries.map(({ vi, pos }) => {
      const isRef = vi === n;
      const v = isRef ? { k: "R", n: g.ref.name, d: "reference recording", chips: [] } : panel.variants[vi];
      const src = g.sources[vi];
      const b = document.createElement("button");
      b.type = "button";
      b.className = "voice";
      b.style.setProperty("--vc", isRef ? "var(--ref)" : blindEl.checked ? VC(0) : VC(vi));
      const gd = g.gainDb(vi);
      // Only show the level-match offset when it is audible enough to matter.
      const lm = lmEl.checked && src && src.rms != null && gd <= -0.5 ? `played ${gd.toFixed(1).replace("-", "−")} dB` : "";
      const flags = !blindEl.checked && src && src.flags.length ? `<span class="flag" title="${esc(src.flags.join(", "))}">! ${esc(src.flags[0])}</span>` : "";
      // With a legend at the top, panels keep to the short names (like the SPLASH voicings page).
      const desc = DATA.legend && !isRef && !/o'clock|noon|fully/.test(v.d || "") ? "" : v.d;
      const detail = [desc, (v.chips || []).map(c => c.k + " " + c.v).join(" · "), lm].filter(Boolean).join(" · ");
      b.innerHTML = blindEl.checked && !isRef
        ? `<span class="k">${pos + 1}</span><span class="t"><span class="n">hidden</span>${lm ? `<span class="d">${esc(lm)}</span>` : ""}</span>`
        : `<span class="k">${esc(v.k)}</span><span class="t"><span class="n">${esc(v.n || "version " + v.k)}</span>${detail ? `<span class="d">${esc(detail)}</span>` : ""}${flags}</span>`;
      b.setAttribute("aria-pressed", vi === g.sel ? "true" : "false");
      b.dataset.vi = vi;
      b.addEventListener("click", () => { current = g; g.select(vi); });
      voicesEl.appendChild(b);
      return b;
    });
    revealEl.innerHTML = "";
    if (blindEl.checked && n > 1) {
      const r = document.createElement("button");
      r.type = "button"; r.className = "ctl"; r.textContent = "Reveal";
      r.addEventListener("click", () => {
        revealEl.textContent = g.order.map((vi, pos) => `${pos + 1} = ${panel.variants[vi].k}`).join(" · ");
      });
      revealEl.appendChild(r);
    }
    g.renderPick();
    g.applyGains();
  };
  g.select = vi => {
    if (vi == null || vi >= g.audios.length) return;
    const t = master().currentTime;
    g.sel = vi;
    g.audios.forEach((a, i) => { if (Math.abs(a.currentTime - t) > 0.02) a.currentTime = t; a.muted = i !== vi; });
    if (g.buttons) g.buttons.forEach(b => b.setAttribute("aria-pressed", +b.dataset.vi === vi ? "true" : "false"));
    g.drawSpec(true);
  };
  g.setRef = ref => {
    if (g.refAudio) { g.refAudio.pause(); g.audios.pop(); g.sources.pop(); g.refAudio = null; }
    g.ref = ref;
    if (ref) {
      const a = new Audio(); a.preload = "metadata"; a.src = ref.wav; a.muted = true;
      try { a.currentTime = master().currentTime; } catch (e) {}
      if (g.playing) a.play().catch(() => {});
      g.refAudio = a; g.audios.push(a); g.sources.push(ref);
    }
    if (g.sel >= g.audios.length) g.select(0);
    g.render();
  };
  g.seek = t => g.audios.forEach(a => { try { a.currentTime = Math.max(0, t); } catch (e) {} });
  g.play = async () => {
    groups.forEach(o => { if (o !== g && o.playing) o.pause(); });
    const t = master().currentTime;
    g.audios.forEach(a => { a.currentTime = t; });
    try { await Promise.all(g.audios.map(a => a.play())); }
    catch (e) {
      // Blocked (the browser wants a click first) or a file failed to load.
      g.audios.forEach(a => a.pause());
      const bad = g.audios.find(a => a.error);
      savedEl.textContent = bad ? "Could not load " + decodeURIComponent(bad.src.split("/").pop()) : "Click Play again to start the audio";
      return;
    }
    if (/Play again|Could not load/.test(savedEl.textContent)) savedEl.textContent = "";
    g.playing = true; playBtn.textContent = "Pause";
    groups.forEach(o => o.el.classList.toggle("active", o === g));
  };
  g.pause = () => { g.audios.forEach(a => a.pause()); g.playing = false; playBtn.textContent = "Play"; };

  let lastSpecKey = null;
  g.drawSpec = force => {
    if (!canvas) return;
    const src = g.sources[g.sel], img = specImage(src), m = master();
    const w = canvas.clientWidth, h = canvas.clientHeight;
    if (!w) return;
    const dpr = window.devicePixelRatio || 1;
    if (canvas.width !== Math.round(w * dpr)) { canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr); }
    const ctx = canvas.getContext("2d");
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (img) { ctx.imageSmoothingEnabled = true; ctx.drawImage(img, 0, 0, canvas.width, canvas.height); }
    else { ctx.fillStyle = "#888"; ctx.font = `${12 * dpr}px sans-serif`; ctx.fillText("no spectrogram for this file", 8 * dpr, 20 * dpr); }
    const span = img && src.spec.t1 > src.spec.t0 ? [src.spec.t0, src.spec.t1] : [0, m.duration || 1];
    const x = (m.currentTime - span[0]) / (span[1] - span[0]) * canvas.width;
    ctx.fillStyle = "rgba(255,255,255,0.9)";
    ctx.fillRect(Math.max(0, Math.min(canvas.width - 2 * dpr, x)), 0, 2 * dpr, canvas.height);
    g.specSpan = span;
  };
  if (canvas) canvas.addEventListener("click", e => {
    current = g;
    const r = canvas.getBoundingClientRect(), span = g.specSpan || [0, master().duration || 0];
    g.seek(span[0] + (e.clientX - r.left) / r.width * (span[1] - span[0]));
    g.drawSpec();
  });

  playBtn.addEventListener("click", () => { current = g; g.playing ? g.pause() : g.play(); });
  cell.querySelectorAll(".jump").forEach(b => b.addEventListener("click", () => {
    current = g; g.seek(parseFloat(b.dataset.t) - 0.3); if (!g.playing) g.play();
  }));
  scrub.addEventListener("input", () => { current = g; g.seek((master().duration || 0) * scrub.value / 1000); });
  cell.addEventListener("pointerdown", () => { current = g; });

  g.tick = () => {
    const m = master();
    if (g.playing) {
      g.audios.forEach(a => { if (a !== m && Math.abs(a.currentTime - m.currentTime) > 0.04) { try { a.currentTime = m.currentTime; } catch (e) {} } });
      if (m.ended) { if (loopEl.checked) { g.seek(0); g.play(); } else g.pause(); }
    }
    timeEl.textContent = fmt(m.currentTime) + " / " + fmt(m.duration);
    if (m.duration) scrub.value = Math.round(1000 * m.currentTime / m.duration);
    if (g.playing || !g.drawn) { g.drawSpec(); g.drawn = !!(canvas && canvas.clientWidth); }
  };
  g.render();
  return g;
}

const rowsEl = $("rows");
DATA.rows.forEach(row => {
  const sec = document.createElement("section");
  sec.className = "row";
  const head = row.name || row.note ? `<div class="rowhead">${row.name ? `<h2>${esc(row.name)}</h2>` : ""}${row.note ? `<span class="note">${esc(row.note)}</span>` : ""}</div>` : "";
  sec.innerHTML = head + `<div class="cols${NCOLS === 1 ? " single" : ""}"></div>`;
  const cols = sec.querySelector(".cols");
  cols.style.setProperty("--ncols", Math.min(NCOLS, 4));
  DATA.cols.forEach(col => {
    const key = row.id + "|" + col.id, panel = DATA.panels[key];
    if (!panel) {
      const e = document.createElement("div"); e.className = "cell empty"; e.textContent = "no render for " + (col.name || "this panel");
      cols.appendChild(e); return;
    }
    const g = makeGroup(row, col, panel, key);
    groups.push(g); cols.appendChild(g.el);
  });
  rowsEl.appendChild(sec);
});
current = groups[0] || null;

/* ---------- legend and the global switch ---------- */
if (DATA.legend) {
  DATA.legend.forEach((v, i) => {
    const d = document.createElement("div");
    d.style.setProperty("--vc", VC(i));
    d.innerHTML = `<b>${esc(v.k)}${v.n ? " · " + esc(v.n) : ""}</b>${esc(v.d || "")}`;
    $("legend").appendChild(d);
  });
} else $("legend").hidden = true;

const globalEl = $("global");
function renderGlobal() {
  globalEl.innerHTML = "";
  const labels = [];
  for (let i = 0; i < maxVariants; i++) labels.push(DATA.legend ? DATA.legend[i].k : "ABCDEFGHIJKLMNOPQRSTUVWXYZ"[i] || String(i + 1));
  const btns = labels.map((lab, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.style.setProperty("--vc", VC(i));
    b.textContent = blindEl.checked ? "#" + (i + 1) : lab;
    b.title = blindEl.checked ? "position " + (i + 1) + " in every panel" : (DATA.legend && DATA.legend[i].n) || "version " + lab + " in every panel";
    b.addEventListener("click", () => {
      groups.forEach(g => { if (i < g.order.length) g.select(blindEl.checked ? g.order[i] : i); });
      btns.forEach((c, j) => c.setAttribute("aria-pressed", j === i ? "true" : "false"));
    });
    globalEl.appendChild(b);
    return b;
  });
  if (DATA.references.length) {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = "R"; b.style.setProperty("--vc", "var(--ref)");
    b.title = "the reference in every panel";
    b.addEventListener("click", () => {
      groups.forEach(g => { if (g.ref) g.select(g.panel.variants.length); });
      [...globalEl.children].forEach(c => c.setAttribute("aria-pressed", c === b ? "true" : "false"));
    });
    b.hidden = !refEl.value;
    globalEl.appendChild(b);
  }
}
renderGlobal();
if (maxVariants < 2 && !DATA.references.length) globalEl.parentElement.querySelector(".tlabel").hidden = globalEl.hidden = true;

/* ---------- notes ---------- */
const notesEl = $("notes");
notesEl.style.setProperty("--ncols", Math.min(NCOLS, 4));
if (NCOLS === 1) notesEl.classList.add("single");
$("notesnote").textContent = (NCOLS > 1 ? "per " + DATA.colsTitle + " · " : "") + "saved as you type";
DATA.cols.forEach(col => {
  const d = document.createElement("div");
  d.style.setProperty("--ac", `var(${col.color})`);
  const lab = col.name || "Notes";
  d.innerHTML = `<div class="notelab">${esc(lab)}</div><textarea placeholder="${esc(lab)} notes"></textarea>`;
  const ta = d.querySelector("textarea");
  ta.value = state.notes[col.id] || "";
  ta.addEventListener("input", () => { state.notes[col.id] = ta.value; save(); });
  notesEl.appendChild(d);
});
const overallEl = $("overall");
overallEl.value = state.overall || "";
overallEl.addEventListener("input", () => { state.overall = overallEl.value; save(); });

/* ---------- results ---------- */
function results() {
  const lines = [`${DATA.title}: my picks and notes`, `Page: ${DATA.source}/${DATA.page}`];
  if (ax.length) lines.push("Layout: " + ax.join(" · "));
  if (lmEl.checked) lines.push("Listened level-matched.");
  if (refEl.value) lines.push("Compared with reference: " + (refById(refEl.value) || {}).name);
  lines.push("");
  DATA.rows.forEach(row => {
    const inRow = DATA.cols.filter(col => DATA.panels[row.id + "|" + col.id] && DATA.panels[row.id + "|" + col.id].variants.length > 1);
    if (!inRow.length) return;
    const indent = row.name ? "- " : "";
    if (row.name) lines.push(`${row.name}:`);
    inRow.forEach(col => {
      const k = row.id + "|" + col.id, p = state.picks[k], panel = DATA.panels[k];
      const v = p == null ? null : panel.variants[p];
      const what = v ? [v.k, v.n].filter(Boolean).join(", ") : "no pick";
      lines.push(`${indent}${col.name ? col.name + ": " : "My pick: "}${what}${v && state.blind[k] ? " (picked blind)" : ""}`);
    });
  });
  const notes = DATA.cols.map(col => [col, (state.notes[col.id] || "").trim()]).filter(x => x[1]);
  if (notes.length) { lines.push(""); notes.forEach(([col, n]) => lines.push(`${col.name ? col.name + " notes" : "Notes"}: ${n}`)); }
  if ((state.overall || "").trim()) { lines.push(""); lines.push(`Overall: ${state.overall.trim()}`); }
  return lines.join("\n");
}
$("copy").addEventListener("click", async () => {
  const text = results();
  try { await navigator.clipboard.writeText(text); savedEl.textContent = "Copied: paste it into the chat"; }
  catch (e) {
    const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch (e2) {}
    ta.remove();
    savedEl.textContent = ok ? "Copied: paste it into the chat" : "Copy blocked: use Download";
  }
});
$("download").addEventListener("click", () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([results()], { type: "text/plain" }));
  a.download = (DATA.title || "review").toLowerCase().replace(/[^a-z0-9]+/g, "-") + "-feedback.txt";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});

/* ---------- toggles ---------- */
blindEl.addEventListener("change", () => {
  groups.forEach(g => { g.order = blindEl.checked ? shuffled(g.panel.variants.map((_, i) => i)) : g.panel.variants.map((_, i) => i); g.render(); });
  renderGlobal();
});
lmEl.addEventListener("change", () => { state.levelMatch = lmEl.checked; save(); groups.forEach(g => g.render()); });
refEl.addEventListener("change", () => {
  state.ref = refEl.value; save();
  const r = refById(refEl.value);
  groups.forEach(g => g.setRef(r));
  renderGlobal();
});
if (refEl.value) groups.forEach(g => g.setRef(refById(refEl.value)));
setInterval(() => groups.forEach(g => g.tick()), 120);
window.addEventListener("resize", () => groups.forEach(g => g.drawSpec()));

/* ---------- keys ---------- */
const nk = Math.min(9, maxVariants);
$("keys").innerHTML = `Keys, on the last panel you touched: ${nk > 1 ? `<kbd>1</kbd>–<kbd>${nk}</kbd> pick a version · ` : ""}` +
  `${DATA.references.length ? "<kbd>0</kbd> the reference · " : ""}<kbd>Space</kbd> play/pause · <kbd>←</kbd> <kbd>→</kbd> 2 s back/forward` +
  `${DATA.rows.some(r => r.loud.length) ? " · <kbd>L</kbd> next loud hit" : ""} · <kbd>Tab</kbd> between buttons.`;
document.addEventListener("keydown", e => {
  const tag = (e.target && e.target.tagName || "").toLowerCase();
  if (!current || tag === "input" || tag === "textarea" || tag === "select" || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key >= "1" && e.key <= "9") {
    const pos = +e.key - 1;
    if (pos < current.order.length) { current.select(current.order[pos]); e.preventDefault(); }
  } else if (e.key === "0" && current.ref) { current.select(current.panel.variants.length); e.preventDefault(); }
  else if (e.key === " ") { current.playing ? current.pause() : current.play(); e.preventDefault(); }
  else if (e.key === "ArrowLeft") current.seek(current.audios[current.sel].currentTime - 2);
  else if (e.key === "ArrowRight") current.seek(current.audios[current.sel].currentTime + 2);
  else if ((e.key === "l" || e.key === "L") && current.row.loud.length) {
    const t = current.audios[current.sel].currentTime, loud = current.row.loud;
    const next = loud.find(x => x - 0.3 > t + 0.5);
    current.seek((next != null ? next : loud[0]) - 0.3); if (!current.playing) current.play();
  }
});
})();
</script>
</body>
</html>
