<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="404" height="1028" viewBox="0 0 50.5 128.5" role="img" aria-labelledby="rv-title rv-desc">
  <title id="rv-title">Resilio Versio panel map</title>
  <desc id="rv-desc">The Noise Engineering Versio front panel with Resilio Versio's controls. Top row: BLEND (left knob) and DECAY (right knob), with four LEDs between them: input left, input right, output left, output right. Below, in the centre: TONE. Next row: SPLASH (left) and TENSION (right). Centre: WOBBLE. Right, lower: DRIVE. Left: two three-way switches, TANK (1, 2, ECHO) above ATTITUDE (CLEAN, TAPE, VALVE). Centre, lower: the THROW / TAP button. Bottom: twelve jacks, labelled as printed on the module (seven CV inputs, one per knob, the gate input, audio in L and R, audio out L and R).</desc>
  <style>text{font-family:var(--rv-font,Helvetica,Arial,sans-serif)}.panel{fill:var(--rv-panel,#f4f2ee);stroke:var(--rv-ink,#1a1a1a);stroke-width:0.25}.knob{fill:var(--rv-knob,#2b2b2b)}.knobmark{stroke:var(--rv-panel,#f4f2ee);stroke-width:0.45;stroke-linecap:round}.name{font-size:2.5px;font-weight:700;fill:var(--rv-ink,#1a1a1a);letter-spacing:0.08px}.pos{font-size:1.45px;fill:var(--rv-ink-soft,#555)}.ledlbl{font-size:1.25px;font-weight:700;fill:var(--rv-ink-soft,#555)}.led{fill:var(--rv-led,#7bc86c);stroke:var(--rv-ink,#1a1a1a);stroke-width:0.12}.tog{fill:var(--rv-metal,#cfcfcf);stroke:var(--rv-ink,#333);stroke-width:0.15}.btn{fill:var(--rv-accent,#c2410c);stroke:var(--rv-ink,#333);stroke-width:0.15}.jack{fill:var(--rv-metal,#d9d9d9);stroke:var(--rv-ink,#333);stroke-width:0.15}.jackhole{fill:var(--rv-ink,#1a1a1a)}.screw{fill:none;stroke:var(--rv-ink-soft,#999);stroke-width:0.12}.note{font-size:1.35px;fill:var(--rv-ink-soft,#555)}.brand{font-size:2.9px;font-weight:800;fill:var(--rv-ink,#1a1a1a);letter-spacing:0.35px}</style>
  <rect class="panel" x="0" y="0" width="50.5" height="128.5" rx="0.6"/>
  <text class="brand" x="25.25" y="8.4" text-anchor="middle">RESILIO</text>
  <circle class="screw" cx="7.65" cy="3.001" r="1.6"/>
  <circle class="screw" cx="43.21" cy="3.001" r="1.6"/>
  <circle class="screw" cx="7.65" cy="125.501" r="1.6"/>
  <circle class="screw" cx="43.21" cy="125.501" r="1.6"/>
  <g id="blend"><circle class="knob" cx="7.77" cy="18.53" r="5.8"/>
    <line class="knobmark" x1="7.77" y1="13.63" x2="7.77" y2="16.5"/>
    <text class="name" x="7.77" y="27.33" text-anchor="middle">BLEND</text></g>
  <g id="decay"><circle class="knob" cx="43.33" cy="18.53" r="5.8"/>
    <line class="knobmark" x1="43.33" y1="13.63" x2="43.33" y2="16.5"/>
    <text class="name" x="43.33" y="27.33" text-anchor="middle">DECAY</text></g>
  <g id="tone"><circle class="knob" cx="25.169" cy="28.69" r="5.8"/>
    <line class="knobmark" x1="25.169" y1="23.79" x2="25.169" y2="26.66"/>
    <text class="name" x="25.169" y="37.49" text-anchor="middle">TONE</text></g>
  <g id="splash"><circle class="knob" cx="7.77" cy="39.485" r="5.8"/>
    <line class="knobmark" x1="7.77" y1="34.585" x2="7.77" y2="37.455"/>
    <text class="name" x="7.77" y="48.285" text-anchor="middle">SPLASH</text></g>
  <g id="tension"><circle class="knob" cx="43.33" cy="39.485" r="5.8"/>
    <line class="knobmark" x1="43.33" y1="34.585" x2="43.33" y2="37.455"/>
    <text class="name" x="43.33" y="48.285" text-anchor="middle">TENSION</text></g>
  <g id="wobble"><circle class="knob" cx="25.169" cy="49.328" r="5.8"/>
    <line class="knobmark" x1="25.169" y1="44.428" x2="25.169" y2="47.298"/>
    <text class="name" x="25.169" y="42.328" text-anchor="middle">WOBBLE</text></g>
  <g id="drive"><circle class="knob" cx="43.33" cy="60.44" r="5.8"/>
    <line class="knobmark" x1="43.33" y1="55.54" x2="43.33" y2="58.41"/>
    <text class="name" x="43.33" y="53.44" text-anchor="middle">DRIVE</text></g>
  <circle class="led" cx="17.295" cy="19.8" r="1.5"/>
  <text class="ledlbl" x="17.295" y="16.8" text-anchor="middle">IN L</text>
  <circle class="led" cx="22.375" cy="19.8" r="1.5"/>
  <text class="ledlbl" x="22.375" y="14.9" text-anchor="middle">IN R</text>
  <circle class="led" cx="29.36" cy="19.8" r="1.5"/>
  <text class="ledlbl" x="29.36" y="16.8" text-anchor="middle">OUT L</text>
  <circle class="led" cx="34.44" cy="19.8" r="1.5"/>
  <text class="ledlbl" x="34.44" y="14.9" text-anchor="middle">OUT R</text>
  <g id="tank"><circle class="tog" cx="8.405" cy="57.9" r="2.54"/>
    <text class="name" x="11.845" y="58.7" style="font-size:2.1px">TANK</text>
    <text class="pos" x="5.865" y="62.44">1 · 2 · ECHO</text></g>
  <g id="attitude"><circle class="tog" cx="8.405" cy="67.425" r="2.54"/>
    <text class="name" x="11.845" y="68.225" style="font-size:2.1px">ATTITUDE</text>
    <text class="pos" x="5.865" y="71.965">CLEAN · TAPE · VALVE</text></g>
  <g id="throw-tap"><circle class="btn" cx="26.185" cy="69.33" r="2.667"/>
    <text class="name" x="26.185" y="74.597" text-anchor="middle" style="font-size:2.1px">THROW / TAP</text></g>
  <circle class="jack" cx="5.23" cy="83.3" r="4.3"/>
  <circle class="jackhole" cx="5.23" cy="83.3" r="2.2"/>
  <circle class="jack" cx="18.565" cy="83.3" r="4.3"/>
  <circle class="jackhole" cx="18.565" cy="83.3" r="2.2"/>
  <circle class="jack" cx="31.9" cy="83.3" r="4.3"/>
  <circle class="jackhole" cx="31.9" cy="83.3" r="2.2"/>
  <circle class="jack" cx="44.6" cy="83.3" r="4.3"/>
  <circle class="jackhole" cx="44.6" cy="83.3" r="2.2"/>
  <circle class="jack" cx="5.23" cy="97.27" r="4.3"/>
  <circle class="jackhole" cx="5.23" cy="97.27" r="2.2"/>
  <circle class="jack" cx="18.565" cy="97.27" r="4.3"/>
  <circle class="jackhole" cx="18.565" cy="97.27" r="2.2"/>
  <circle class="jack" cx="31.9" cy="97.27" r="4.3"/>
  <circle class="jackhole" cx="31.9" cy="97.27" r="2.2"/>
  <circle class="jack" cx="44.6" cy="97.27" r="4.3"/>
  <circle class="jackhole" cx="44.6" cy="97.27" r="2.2"/>
  <circle class="jack" cx="5.23" cy="111.24" r="4.3"/>
  <circle class="jackhole" cx="5.23" cy="111.24" r="2.2"/>
  <circle class="jack" cx="18.565" cy="111.24" r="4.3"/>
  <circle class="jackhole" cx="18.565" cy="111.24" r="2.2"/>
  <circle class="jack" cx="31.9" cy="111.24" r="4.3"/>
  <circle class="jackhole" cx="31.9" cy="111.24" r="2.2"/>
  <circle class="jack" cx="44.6" cy="111.24" r="4.3"/>
  <circle class="jackhole" cx="44.6" cy="111.24" r="2.2"/>
  <text class="note" x="25.25" y="117.6" text-anchor="middle">Jacks as printed on your module: each knob's</text>
  <text class="note" x="25.25" y="119.4" text-anchor="middle">CV input follows its knob; gate, In L/R, Out L/R.</text>
  <text class="note" x="25.25" y="121.5" text-anchor="middle" style="font-size:1.1px">Panel geometry: Noise Engineering Versio template</text>
</svg>
